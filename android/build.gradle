plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// ─── Machine-local build inputs ──────────────────────────────────
//
// The OpenCV Android SDK is a ~300MB download and lives wherever you
// unpacked it, so its path must NOT be hardcoded here (this file is version
// controlled, and the plugin is consumed by other apps). Read it from
// local.properties (git-ignored, Android's standard place for this) with the
// OPENCV_ANDROID_SDK env var as a fallback.
//
// Put this in the app's android/local.properties:
//     opencv.sdk.dir=/path/to/OpenCV-android-sdk
def localProps = new Properties()
[
    rootProject.file('local.properties'),
    project.file('local.properties'),
].findAll { it.exists() }.each {
    it.withInputStream { localProps.load(it) }
}
def opencvSdkDir = localProps.getProperty('opencv.sdk.dir') ?:
        System.getenv('OPENCV_ANDROID_SDK')

// ─── Prebuilt vs. compiled native library ────────────────────────
//
// The package ships prebuilt libcimbar_jni.so files in src/main/jniLibs/<abi>
// (OpenCV statically linked in), so consumers need neither the NDK nor the
// OpenCV Android SDK, and `flutter build apk` gets much faster. This is the
// default, and it is also required: leaving CMake enabled on top of jniLibs
// makes AGP fail with "2 files found with path
// 'lib/arm64-v8a/libcimbar_jni.so'" (jniLibs vs. compiled output).
//
// Set libcimbar.preferPrebuilt=false to compile from the vendored sources
// instead, e.g. after changing native code (needs NDK + OpenCV Android SDK).
def preferPrebuilt = true
def preferPrebuiltProp = project.findProperty('libcimbar.preferPrebuilt')
if (preferPrebuiltProp == null) { preferPrebuiltProp = localProps.getProperty('libcimbar.preferPrebuilt') }
if (preferPrebuiltProp != null) { preferPrebuilt = Boolean.parseBoolean(preferPrebuiltProp.toString()) }

if (!preferPrebuilt && !opencvSdkDir) {
    logger.warn(
        'libcimbar: preferPrebuilt=false but opencv.sdk.dir is not set ' +
        '(android/local.properties) and OPENCV_ANDROID_SDK is unset - the ' +
        'native build will likely fail to find OpenCV.')
}

android {
    namespace 'com.libcimbar.plugin'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        // Only meaningful when compiling from source (see preferPrebuilt).
        if (!preferPrebuilt) {
            externalNativeBuild {
                cmake {
                    def cmakeArgs = ['-DANDROID_STL=c++_shared']
                    // LIBCIMBAR_SRC_PATH is left unset on purpose: the
                    // CMakeLists probes third_party/libcimbar and
                    // third_party/libcimbar_cpp itself, so a rename upstream
                    // can't break the build.
                    if (opencvSdkDir) {
                        cmakeArgs.add("-DOPENCV_ANDROID_SDK_PATH=${opencvSdkDir}")
                    }
                    // `*` spreads the list: arguments() is varargs, not a
                    // collection setter, so passing the list directly fails
                    // with "Could not find method arguments()".
                    arguments(*cmakeArgs)
                    cppFlags '-std=c++17 -fexceptions'
                }
            }
        }
    }

    // Skipped when using the prebuilt .so files - see preferPrebuilt above.
    if (!preferPrebuilt) {
        externalNativeBuild {
            cmake {
                path file('src/main/cpp/CMakeLists.txt')
                version '3.22.1'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
}
