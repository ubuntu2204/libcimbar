name: libcimbar
description: >-
  Dart/Flutter plugin for Color Icon Matrix Barcodes (cimbar).
  Encode files into high-density color barcode images and decode them
  from camera frames. Supports air-gapped data transfer at ~850 kbps
  using monitor + camera — no WiFi, Bluetooth, or NFC needed.
  Platforms: Linux/Windows (FFI), Android (FFI), Web (WASM).
version: 0.1.0
homepage: https://github.com/sz3/libcimbar
repository: https://github.com/sz3/libcimbar
issue_tracker: https://github.com/sz3/libcimbar/issues
documentation: https://github.com/sz3/libcimbar/wiki

topics:
  - barcode
  - ffi
  - camera
  - wasm
  - data-transfer

platforms:
  android:
  linux:
  web:
  windows:

environment:
  # Dart 3.10 is the minimum for build hooks (hook/build.dart).
  sdk: ^3.10.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  ffi: ^2.1.0
  plugin_platform_interface: ^2.1.8
  # App-facing conveniences (CimbarFramePlayer examples, file picking/saving)
  file_selector: ^1.0.3
  path_provider: ^2.1.2
  web: ^1.1.0
  hooks: ^2.2.0
  code_assets: ^2.0.0
  native_toolchain_c: ^0.19.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  ffigen: ^12.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.libcimbar.plugin
        pluginClass: LibcimbarPlugin
      windows:
        pluginClass: LibcimbarPluginCApi
      web:
        pluginClass: LibcimbarWeb
        fileName: src/web/libcimbar_web.dart

  assets:
    - assets/wasm/
