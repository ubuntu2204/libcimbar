# ffigen configuration for libcimbar native bindings.
#
# Usage:
#   dart run ffigen --config ffigen.yaml
#
# This generates Dart FFI bindings from the libcimbar C API headers.
# The output is placed in lib/src/ffi/generated/.
#
# Prerequisites:
#   - Build libcimbar first (see native/build_windows.bat)
#   - Install llvm: dart pub global activate ffigen

name: LibcimbarNative
description: Auto-generated FFI bindings for libcimbar C API.
output: 'lib/src/ffi/generated/libcimbar_bindings.dart'

headers:
  entry-points:
    - 'C:/project/libcimbar/libcimbar/src/lib/cimbar_js/cimbar_js.h'
    - 'C:/project/libcimbar/libcimbar/src/lib/cimbar_js/cimbar_recv_js.h'
  include-directives:
    - '**/cimbar_js.h'
    - '**/cimbar_recv_js.h'

preamble: |
  // Copyright (c) 2024. Licensed under MPL-2.0.
  // Auto-generated by ffigen. Do not edit manually.

ffi-native:

comments:
  style: any
  length: full
