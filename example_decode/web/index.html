<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="libcimbar Web Decoder">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="libcimbar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>libcimbar Decoder</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a2e;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 16px;
      border: 3px solid #333;
      border-top: 3px solid #7c4dff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading libcimbar WASM decoder...</p>
  </div>

  <!-- Load the libcimbar WASM module BEFORE Flutter loads -->
  <script>
    // Emscripten Module configuration
    var Module = {
      canvas: (function() {
        var canvas = document.createElement('canvas');
        canvas.style.display = 'none';
        document.body.appendChild(canvas);
        return canvas;
      })(),
      onRuntimeInitialized: function() {
        console.log('libcimbar WASM module loaded');
        window.__libcimbarReady = true;
      },
      print: function(text) { console.log('[cimbar]', text); },
      printErr: function(text) { console.warn('[cimbar]', text); },
    };
  </script>

  <!-- libcimbar WASM JS glue (must be built with build_wasm.sh first) -->
  <script>
    // Load libcimbar WASM module if the JS glue file exists.
    // Build with: cd native && ./build_wasm.sh
    // Then copy output to example/web/assets/wasm/
    (function() {
      var script = document.createElement('script');
      script.src = 'assets/wasm/libcimbar.js';
      script.onload = function() {
        console.log('[libcimbar] WASM JS glue loaded');
      };
      script.onerror = function() {
        console.warn('[libcimbar] WASM JS glue not found at assets/wasm/libcimbar.js');
        console.warn('[libcimbar] Build with: cd native && ./build_wasm.sh');
        console.warn('[libcimbar] Then copy output to example/web/assets/wasm/');
        window.__libcimbarWasmMissing = true;
      };
      document.head.appendChild(script);
    })();
  </script>

  <!-- Flutter bootstrap -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Remove loading indicator once Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
</body>
</html>
